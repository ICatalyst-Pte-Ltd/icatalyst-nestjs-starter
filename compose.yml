services:
  app:
    build:
      args:
        BUILD_VERSION: ${BUILD_VERSION}
        PIPELINE_ID: ${PIPELINE_ID}
        PIPELINE_INTERNAL_ID: ${PIPELINE_INTERNAL_ID}
        PIPELINE_URL: ${PIPELINE_URL}
        GIT_BRANCH: ${GIT_BRANCH}
        COMMIT_SHA: ${COMMIT_SHA}
        COMMIT_TIME: ${COMMIT_TIME}
      context: .
    environment:
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL}
      CACHE_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DATABASE_URL: postgresql://${DATABASE_USER}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 1s
      test:
        - CMD-SHELL
        - curl --fail --silent http://app:$APP_PORT/health || exit 1
      timeout: 3s
    # TODO change the image to a proper name
    image: <image-name>:latest
    networks:
      - database
      - redis
    ports:
      - published: ${APP_PORT:-3000}
        target: 3000

  database:
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USER}
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 1s
      test:
        - CMD-SHELL
        - pg_isready --username=$DATABASE_USER --dbname=$DATABASE_NAME
      timeout: 3s
    image: postgres:${POSTGRES_VERSION:-alpine}
    networks:
      - database
    volumes:
      - type: volume
        source: database-data
        target: /var/lib/postgresql

  redis:
    healthcheck:
      interval: 10s
      retries: 3
      start_period: 1s
      test:
        - CMD-SHELL
        - '[ "$(redis-cli PING)" = "PONG" ]'
      timeout: 3s
    image: redis:${REDIS_VERSION:-alpine}
    networks:
      - redis
    volumes:
      - type: volume
        source: redis-data
        target: /data

networks:
  database:
  redis:

volumes:
  database-data:
  redis-data:
