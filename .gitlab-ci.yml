workflow:
  rules:
    # A merge request, run a merge request pipeline.
    # For example, a merge request pipeline can be triggered by a push to a branch with an associated open merge request.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A change to a branch, but a merge request is open for that branch, do not run a branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    # A change to a branch, but without any open merge requests, run a branch pipeline.
    - if: $CI_COMMIT_BRANCH

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/#customizing-settings
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
include:
  - template: Code-Quality.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

# Override the rules so that this job also runs for pipelines for merge requests
code_quality:
  rules:
    - if: $CODE_QUALITY_DISABLED
      when: never
    # - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID

# Override the rules so that this job also runs for pipelines for merge requests,
# the needs so that it depends on the docker-build job,
# and sets the image name
container_scanning:
  needs:
    - docker-build
  rules:
    - if: $CONTAINER_SCANNING_DISABLED
      when: never
    # - if: $CI_COMMIT_BRANCH &&
    - if: ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_IID) &&
        $CI_GITLAB_FIPS_MODE == "true" &&
        $CS_ANALYZER_IMAGE !~ /-(fips|ubi)\z/
      variables:
        CS_IMAGE_SUFFIX: -fips
    # - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_IID
  variables:
    CS_IMAGE: ${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}

# Override the rules so that this job also runs for pipelines for merge requests
semgrep-sast:
  rules:
    - if: $SAST_DISABLED
      when: never
    - if: $SAST_EXCLUDED_ANALYZERS =~ /semgrep/
      when: never
    # - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID
      exists:
        - '**/*.py'
        - '**/*.js'
        - '**/*.jsx'
        - '**/*.ts'
        - '**/*.tsx'
        - '**/*.c'
        - '**/*.go'

# Override the rules so that this job also runs for pipelines for merge requests
secret_detection:
  rules:
    - if: $SECRET_DETECTION_DISABLED
      when: never
    # - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_BRANCH || $CI_MERGE_REQUEST_IID

stages:
  - test
  - release
  - deploy:staging
  - verify
  - deploy:production

.node:
  before_script:
    - node --version
    - npm --version
    - npm ci
  cache:
    key:
      files:
        - package.json
        - package-lock.json
    paths:
      - node_modules/
  image: node:24

unit-test:
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit:
        - .vitest/junit/output.xml
    when: always
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  extends:
    - .node
  script:
    - npx prisma generate
    - npm run test:cov
  variables:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_database?schema=public

e2e-test:
  extends:
    - .node
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
  services:
    - postgres:alpine
    - redis:alpine
  script:
    - npx prisma generate
    - npx prisma migrate deploy
    - npm run test:e2e
  variables:
    APP_NAME: $CI_PROJECT_PATH
    APP_URL: http://localhost:3000
    CACHE_URL: redis://${REDIS_HOST}:${REDIS_PORT}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    POSTGRES_DB: test_database
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
    REDIS_HOST: redis
    REDIS_PORT: 6379

check-prisma-schema:
  extends:
    - .node
  rules:
    - changes:
        - prisma/schema.prisma
      if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_IID
  script:
    - ./scripts/check-schema
  services:
    - postgres:alpine
  variables:
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    POSTGRES_DB: test_database
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres

.docker:
  before_script:
    - docker version
    - docker compose version
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_TLS_CERTDIR: /certs

docker-build:
  extends:
    - .docker
  rules:
    - exists:
        - Dockerfile
      if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_MERGE_REQUEST_IID
  script:
    - PACKAGE_VERSION=$(grep '"version":' package.json | cut -d \" -f 4)
    - docker build
      --build-arg "BUILD_VERSION=$PACKAGE_VERSION"
      --build-arg "COMMIT_SHA=$CI_COMMIT_SHA"
      --build-arg "COMMIT_TIME=$CI_COMMIT_TIMESTAMP"
      --build-arg "GIT_BRANCH=$CI_COMMIT_BRANCH"
      --build-arg "PIPELINE_ID=$CI_PIPELINE_ID"
      --build-arg "PIPELINE_INTERNAL_ID=$CI_PIPELINE_IID"
      --build-arg "PIPELINE_URL=$CI_PIPELINE_URL"
      --file ./Dockerfile
      --tag "${APP_IMAGE_NAME}:latest"
      --tag "${CI_REGISTRY_IMAGE}:${CI_PIPELINE_IID}"
      .
    - |
      if [[ "$CI_COMMIT_BRANCH" == "$CI_DEFAULT_BRANCH" ]]; then
        docker tag "${APP_IMAGE_NAME}:latest" "${CI_REGISTRY_IMAGE}:latest"
      fi
    - docker image ls
    - docker inspect "${APP_IMAGE_NAME}:latest"
    - echo "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker push --all-tags "$CI_REGISTRY_IMAGE"
  variables:
    APP_IMAGE_NAME: $CI_PROJECT_PATH

.release:
  artifacts:
    paths:
      - dist/
  extends:
    - .node
  script:
    - npx prisma generate
    - npm run build
    - npx semantic-release ${CI_MERGE_REQUEST_IID:+--dry-run}

test-release:
  extends:
    - .release
  rules:
    - if: $CI_MERGE_REQUEST_IID
  stage: test

release:
  extends:
    - .release
  resource_group: release
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  stage: release

.deployment:
  before_script:
    - python --version
    - python -m venv ~/venv
    - source ~/venv/bin/activate
    - python -m pip install --upgrade pip setuptools wheel
    - pip --version
    - pip install awsebcli
    - eb --version
  image: python:3.12
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - eb init "$CI_PROJECT_NAME" --platform node.js --region "$AWS_REGION"
    - BUILD_VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
    # - envsubst < .ebextensions/env.yml > .ebextensions/env.config
    - sed
      --expression 's|${BUILD_VERSION}|'"$BUILD_VERSION"'|g'
      --expression 's|${CI_PIPELINE_ID}|'"$CI_PIPELINE_ID"'|g'
      --expression 's|${CI_PIPELINE_IID}|'"$CI_PIPELINE_IID"'|g'
      --expression 's|${CI_PIPELINE_URL}|'"$CI_PIPELINE_URL"'|g'
      --expression 's|${CI_COMMIT_BRANCH}|'"$CI_COMMIT_BRANCH"'|g'
      --expression 's|${CI_COMMIT_SHA}|'"$CI_COMMIT_SHA"'|g'
      --expression 's|${CI_COMMIT_TIMESTAMP}|'"'$CI_COMMIT_TIMESTAMP'"'|g'
      .ebextensions/env.yml > .ebextensions/env.config
    - eb deploy --timeout 20 --verbose "$ENVIRONMENT_NAME"

# TODO remove the dot to make the job visible
# Deploys to a staging environment
.deploy-to-staging:
  environment:
    deployment_tier: staging
    name: staging
    # TODO replace with proper URL
    url: https://<e.g., app-staging.example.com>
  extends: .deployment
  needs:
    - release
  resource_group: deploy-staging
  stage: deploy:staging
  variables:
    # TODO replace with proper region
    AWS_REGION: <e.g., ap-southeast-1>
    # TODO replace with proper environment name
    ENVIRONMENT_NAME: <e.g., env-name>

# TODO remove the dot to make the job visible
# Checks the health of the staging environment
.health-check:
  image: curlimages/curl:latest
  needs:
    - .deploy-to-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      HEALTH_URL="https://${ENVIRONMENT_URL}/health"
      echo "Checking health endpoint at: $HEALTH_URL"
      MAX_RETRIES=5
      RETRY_DELAY=30
      RETRY_COUNT=0
      while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "$HEALTH_URL")
        echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES - Status: $HTTP_STATUS"
        if [ "$HTTP_STATUS" -eq 200 ]; then
          echo "Health check successful!"
          exit 0
        fi
        RETRY_COUNT=$((RETRY_COUNT+1))
        if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
          echo "Waiting ${RETRY_DELAY}s before next attempt..."
          sleep $RETRY_DELAY
        fi
      done
      echo "Health check failed after $MAX_RETRIES attempts! Last status code: $HTTP_STATUS"
      exit 1
  stage: verify
  variables:
    # TODO replace with proper host name
    ENVIRONMENT_URL: <e.g., app-staging.example.com>

.load-testing:
  artifacts:
    paths:
      - reports
  image:
    name: artilleryio/artillery:latest
    entrypoint: ['']
  needs:
    - .deploy-to-staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - mkdir reports
    - /home/node/artillery/bin/run run-fargate
      --config tests/performance/config.yml
      --count 10
      --environment staging
      --output reports/report.json
      --region ap-northeast-1
      --tags CostCenter:load-testing,PipelineID:$CI_PIPELINE_ID
      tests/performance/scenarios/scenario.yml
    - /home/node/artillery/bin/run report
      --output reports/report.html
      reports/report.json
  stage: verify

# TODO remove the dot to make the job visible
# Deploys to a production environment
.deploy-to-production:
  environment:
    deployment_tier: production
    name: production
    # TODO replace with proper URL
    url: https://<e.g., app.example.com>
  extends: .deployment
  needs:
    - release # The release is necessary to inherit the dist directory.
    - .health-check
  resource_group: deploy-production
  stage: deploy:production
  variables:
    # TODO replace with proper region
    AWS_REGION: <e.g., ap-southeast-1>
    # TODO replace with proper environment name
    ENVIRONMENT_NAME: <e.g., env-name>
